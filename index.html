<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kantele</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: #111827;
        --panel-2: #1f2937;
        --text: #e5e7eb;
        --muted: #94a3b8;
        --primary: #8b5cf6;
        --accent: #22c55e;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, var(--bg), #111827 35%, #1e293b);
        color: var(--text);
      }

      .card {
        width: min(90vw, 760px);
        background: rgba(17, 24, 39, 0.9);
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 20px;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
        padding: 48px 32px;
      }

      .eyebrow {
        display: inline-block;
        padding: 8px 12px;
        border-radius: 999px;
        background: rgba(139, 92, 246, 0.14);
        color: #ddd6fe;
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-weight: 700;
      }

      h1 {
        margin: 18px 0 12px;
        font-size: clamp(2.5rem, 5vw, 4rem);
        line-height: 1.05;
      }

      p {
        margin: 0 0 24px;
        color: var(--muted);
        font-size: 1.08rem;
        line-height: 1.7;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
      }

      a.button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 14px 20px;
        border-radius: 12px;
        text-decoration: none;
        font-weight: 700;
        transition: transform 0.2s ease, opacity 0.2s ease;
      }

      a.button:hover {
        transform: translateY(-1px);
      }

      a.button.primary {
        background: linear-gradient(135deg, var(--primary), #a78bfa);
        color: white;
      }

      a.button.secondary {
        background: rgba(148, 163, 184, 0.08);
        color: var(--text);
        border: 1px solid rgba(148, 163, 184, 0.2);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <span class="eyebrow">Projeto</span>
      <h1>Kantele</h1>
      <p>
        Página inicial do repositório. Aqui você pode apresentar o projeto, explicar
        sua finalidade e apontar para documentação ou arquivos importantes.
      </p>

      <div class="actions">
        <a class="button primary" href="README.md">Abrir README</a>
        <a class="button secondary" href="https://github.com/mrschbo/Kantele" target="_blank" rel="noreferrer">
          Ver no GitHub
        </a>
      </div>
    </main>
  </body>
</html>
